<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PepNationRX - Affiliate Dashboard Demo</title>

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/components/dashboard.css" />

  <style>
    /* Demo-page chrome only. Production pages will use the shared shell. */
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--color-bg);
      color: var(--color-text-primary);
      font-family: var(--font-sans);
    }

    .demo {
      max-width: var(--layout-max-width);
      margin: 0 auto;
      padding: var(--space-7) var(--layout-gutter) var(--space-9);
    }

    .demo__brand {
      margin: 0 0 var(--space-6);
      text-align: center;
      font-size: var(--text-sm);
      font-weight: var(--weight-medium);
      letter-spacing: var(--tracking-wide);
      text-transform: uppercase;
      color: var(--teal-500);
    }
  </style>
</head>
<body>
  <main class="demo">
    <p class="demo__brand">PepNationRX</p>

    <pnrx-affiliate-dashboard mode="demo"></pnrx-affiliate-dashboard>
  </main>

  <script type="module">
    // Importing the component registers the <pnrx-affiliate-dashboard> element.
    import './js/components/pnrx-affiliate-dashboard.js';

    // Synthetic payload matching the GET /api/affiliate/dashboard response.
    const demoData = {
      affiliate: {
        organization_name: 'Iron Standard BJJ',
        affiliate_code: 'IRONBJJ',
        organization_type: 'bjj',
        revenue_share_pct: '10.00',
      },
      referralPath: '/?ref=IRONBJJ',
      summary: {
        referralsLanded: 64,
        referralsConverted: 19,
        conversionRate: 0.296875,
        attributedMrrCents: 388100,
        revenueSharePct: 10,
        estimatedMonthlyEarningsCents: 38810,
        paidToDateCents: 142500,
        pendingPayoutCents: 38810,
      },
      referrals: [
        {
          referral_link_slug: 'IRONBJJ',
          landed_at: '2026-05-20T14:00:00Z',
          converted_at: '2026-05-21T09:00:00Z',
        },
        {
          referral_link_slug: 'IRONBJJ',
          landed_at: '2026-05-19T11:00:00Z',
          converted_at: null,
        },
        {
          referral_link_slug: 'IRONBJJ',
          landed_at: '2026-05-18T16:30:00Z',
          converted_at: '2026-05-19T20:00:00Z',
        },
      ],
      payouts: [
        {
          period_start: '2026-04-01',
          period_end: '2026-04-30',
          amount_cents: 38120,
          status: 'paid',
        },
        {
          period_start: '2026-05-01',
          period_end: '2026-05-31',
          amount_cents: 38810,
          status: 'pending',
        },
      ],
    };

    customElements.whenDefined('pnrx-affiliate-dashboard').then(function () {
      document.querySelector('pnrx-affiliate-dashboard').renderData(demoData);
    });
  </script>
</body>
</html>
