<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PepNationRX - Treatment Catalog Demo</title>

  <!-- Foundational design tokens, then the catalog component styles. -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/components/catalog.css" />

  <style>
    /* Demo-page chrome only. Production pages will use the shared shell. */
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--color-bg);
      color: var(--color-text-primary);
      font-family: var(--font-sans);
    }

    .demo {
      max-width: var(--layout-max-width);
      margin: 0 auto;
      padding: var(--space-7) var(--layout-gutter) var(--space-9);
    }

    .demo__brand {
      margin: 0 0 var(--space-6);
      text-align: center;
      font-size: var(--text-sm);
      font-weight: var(--weight-medium);
      letter-spacing: var(--tracking-wide);
      text-transform: uppercase;
      color: var(--teal-500);
    }

    .demo__output {
      max-width: 720px;
      margin: var(--space-6) auto 0;
      padding: var(--space-4);
      background: var(--color-surface-recessed);
      border: var(--border-hairline);
      border-radius: var(--radius-lg);
      box-shadow: var(--bevel-inset);
    }

    .demo__output h2 {
      margin: 0 0 var(--space-3);
      font-size: var(--text-lg);
      font-weight: var(--weight-medium);
      color: var(--teal-500);
    }

    .demo__payload {
      margin: 0;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      line-height: var(--leading-base);
      color: var(--color-text-primary);
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <main class="demo">
    <p class="demo__brand">PepNationRX</p>

    <pnrx-catalog></pnrx-catalog>

    <section class="demo__output" id="output" hidden>
      <h2>Catalog Selection</h2>
      <pre class="demo__payload" id="payload"></pre>
    </section>
  </main>

  <script type="module">
    // Importing the component registers the <pnrx-catalog> custom element.
    import './js/components/pnrx-catalog.js';

    // On Begin Intake, surface the selection a host would route to triage.
    const catalog = document.querySelector('pnrx-catalog');
    catalog.addEventListener('catalog:select', function (event) {
      const output = document.getElementById('output');
      output.hidden = false;
      document.getElementById('payload').textContent = JSON.stringify(
        event.detail,
        null,
        2
      );
      output.scrollIntoView({ behavior: 'smooth' });
    });
  </script>
</body>
</html>
