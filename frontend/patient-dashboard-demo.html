<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PepNationRX - Patient Dashboard Demo</title>

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/components/dashboard.css" />

  <style>
    /* Demo-page chrome only. Production pages will use the shared shell. */
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--color-bg);
      color: var(--color-text-primary);
      font-family: var(--font-sans);
    }

    .demo {
      max-width: var(--layout-max-width);
      margin: 0 auto;
      padding: var(--space-7) var(--layout-gutter) var(--space-9);
    }

    .demo__brand {
      margin: 0 0 var(--space-6);
      text-align: center;
      font-size: var(--text-sm);
      font-weight: var(--weight-medium);
      letter-spacing: var(--tracking-wide);
      text-transform: uppercase;
      color: var(--teal-500);
    }
  </style>
</head>
<body>
  <main class="demo">
    <p class="demo__brand">PepNationRX</p>

    <pnrx-patient-dashboard mode="demo"></pnrx-patient-dashboard>
  </main>

  <script type="module">
    // Importing the component registers the <pnrx-patient-dashboard> element.
    import './js/components/pnrx-patient-dashboard.js';

    // Synthetic payload matching the GET /api/patient/dashboard response.
    const demoData = {
      profile: { first_name: 'Daniel', last_name: 'B', role: 'patient' },
      summary: {
        activeSubscriptionCount: 2,
        prescriptionCount: 3,
        openOrderCount: 1,
        lifetimeSpendCents: 124700,
      },
      subscriptions: [
        {
          plan_name: 'Testosterone Optimization',
          protocol_category: 'trt',
          status: 'active',
          mrr_cents: 9900,
          next_billing_date: '2026-06-15',
        },
        {
          plan_name: 'Weight Management',
          protocol_category: 'weight_management',
          status: 'past_due',
          mrr_cents: 32900,
          next_billing_date: '2026-06-01',
        },
      ],
      prescriptions: [
        {
          drug_compound: 'Testosterone Cypionate',
          strength: '200mg Per mL',
          status: 'active',
          written_date: '2026-05-01',
        },
        {
          drug_compound: 'Semaglutide',
          strength: '2.5mg',
          status: 'approved',
          written_date: '2026-05-10',
        },
        { drug_compound: 'Sermorelin', status: 'pending_review' },
      ],
      orders: [
        {
          status: 'shipped',
          tracking_carrier: 'fedex',
          tracking_number: '7712 3456 7890',
          estimated_delivery: '2026-05-26',
        },
      ],
      billing: {
        transactions: [
          {
            gross_amount_cents: 9900,
            status: 'succeeded',
            created_at: '2026-05-15T10:00:00Z',
          },
          {
            gross_amount_cents: 32900,
            status: 'succeeded',
            created_at: '2026-05-10T10:00:00Z',
          },
        ],
        lifetimeSpendCents: 124700,
      },
    };

    customElements.whenDefined('pnrx-patient-dashboard').then(function () {
      document.querySelector('pnrx-patient-dashboard').renderData(demoData);
    });
  </script>
</body>
</html>
