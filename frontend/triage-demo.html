<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PepNationRX - Clinical Intake Demo</title>

  <!-- Foundational design tokens, then the triage component styles. -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/components/triage-form.css" />

  <style>
    /* Demo-page chrome only. Production pages will use the shared shell. */
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--color-bg);
      color: var(--color-text-primary);
      font-family: var(--font-sans);
    }

    .demo {
      max-width: var(--layout-max-width);
      margin: 0 auto;
      padding: var(--space-7) var(--layout-gutter) var(--space-9);
    }

    .demo__title {
      margin: 0 0 var(--space-2);
      text-align: center;
      font-size: var(--text-3xl);
      font-weight: var(--weight-bold);
      color: var(--white-soft);
    }

    .demo__lede {
      margin: 0 auto var(--space-7);
      max-width: 560px;
      text-align: center;
      font-size: var(--text-md);
      line-height: var(--leading-base);
      color: var(--color-text-secondary);
    }

    .demo__output {
      max-width: 720px;
      margin: var(--space-6) auto 0;
      padding: var(--space-4);
      background: var(--color-surface-recessed);
      border: var(--border-hairline);
      border-radius: var(--radius-lg);
      box-shadow: var(--bevel-inset);
    }

    .demo__output h2 {
      margin: 0 0 var(--space-3);
      font-size: var(--text-lg);
      font-weight: var(--weight-medium);
      color: var(--teal-500);
    }

    .demo__payload {
      margin: 0;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      line-height: var(--leading-base);
      color: var(--color-text-primary);
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <main class="demo">
    <h1 class="demo__title">PepNationRX Clinical Intake</h1>
    <p class="demo__lede">
      A Demonstration Of The Branching Triage Questionnaire. Responses Are
      Screened, Scored, And Routed To An Independent, Licensed Clinician.
    </p>

    <pnrx-triage-form></pnrx-triage-form>

    <section class="demo__output" id="output" hidden>
      <h2>Submission Payload</h2>
      <pre class="demo__payload" id="payload"></pre>
    </section>
  </main>

  <script type="module">
    // Importing the component registers the <pnrx-triage-form> custom element.
    import './js/components/pnrx-triage-form.js';

    // On submit, surface the payload that would be sent to POST /api/intake.
    const form = document.querySelector('pnrx-triage-form');
    form.addEventListener('triage:submit', function (event) {
      const output = document.getElementById('output');
      output.hidden = false;
      document.getElementById('payload').textContent = JSON.stringify(
        event.detail,
        null,
        2
      );
      output.scrollIntoView({ behavior: 'smooth' });
    });
  </script>
</body>
</html>
